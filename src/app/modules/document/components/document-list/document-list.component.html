<div class="document-list">
    <h2>Входящие документы</h2>
  
    <div class="toolbar">
      <button mat-raised-button color="primary" (click)="openForm()">Добавить</button>
    </div>
  
    <table mat-table [dataSource]="documents" class="mat-elevation-z2" matSort>
  
    
      <ng-container matColumnDef="file">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Файл</th>
        <td mat-cell *matCellDef="let row">
          <button *ngIf="row.file" mat-icon-button (click)="openFile(row.file)">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>
  

      <ng-container matColumnDef="regNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Рег. №</th>
        <td mat-cell *matCellDef="let row">{{ row.regNumber }}</td>
      </ng-container>
  

      <ng-container matColumnDef="regDate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Дата рег.</th>
        <td mat-cell *matCellDef="let row">{{ row.regDate | date:'yyyy-MM-dd' }}</td>
      </ng-container>
  
      
      <ng-container matColumnDef="outNumber">
        <th mat-header-cell *matHeaderCellDef>№ исх. док-та</th>
        <td mat-cell *matCellDef="let row">{{ row.outNumber || '-' }}</td>
      </ng-container>
  
      <ng-container matColumnDef="outDate">
        <th mat-header-cell *matHeaderCellDef>Дата исх. док-та</th>
        <td mat-cell *matCellDef="let row">
          {{ row.outDate ? (row.outDate | date:'yyyy-MM-dd') : '-' }}
        </td>
      </ng-container>
  
     
      <ng-container matColumnDef="correspondent">
        <th mat-header-cell *matHeaderCellDef>Корреспондент</th>
        <td mat-cell *matCellDef="let row">{{ row.correspondent }}</td>
      </ng-container>
  
   
      <ng-container matColumnDef="topic">
        <th mat-header-cell *matHeaderCellDef>Тема</th>
        <td mat-cell *matCellDef="let row">{{ row.topic }}</td>
      </ng-container>
  
      
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Действия</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="printDocument(row)" matTooltip="Печать">
            <mat-icon>print</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  </div>
